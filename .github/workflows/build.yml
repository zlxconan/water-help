name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build (universal x86_64 + arm64)
        run: |
          cd src-tauri
          cargo build --release --target x86_64-apple-darwin --target aarch64-apple-darwin
          lipo -create \
            -output waterhelp-universal \
            target/x86_64-apple-darwin/release/waterhelp \
            target/aarch64-apple-darwin/release/waterhelp
      - name: Bundle .app
        run: bash scripts/bundle-macos.sh
      - name: Zip
        run: cd dist && zip -qry WaterHelp-macOS-universal.zip WaterHelp.app
      - uses: actions/upload-artifact@v4
        with:
          name: WaterHelp-macOS-universal
          path: dist/WaterHelp-macOS-universal.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build
        run: cargo build --release
        working-directory: src-tauri
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path src-tauri/target/release/waterhelp.exe -DestinationPath WaterHelp-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WaterHelp-Windows-x64
          path: WaterHelp-Windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
          body: |
            💧 喝水助手 WaterHelp

            - `WaterHelp-macOS-universal.zip` — macOS 通用版（Intel + Apple Silicon），解压后拖入「应用程序」
            - `WaterHelp-Windows-x64.zip` — Windows 版（免安装，解压即用，需系统自带 WebView2）
