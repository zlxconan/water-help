[package]
name = "waterhelp"
version = "1.0.0"
description = "💧 喝水助手 - 跨平台菜单栏/托盘喝水提醒 (macOS / Windows)"
authors = ["WaterHelp Contributors"]
license = "MIT"
repository = "https://github.com/waterhelp/water-help"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
chrono = "0.4"
tauri-plugin-notification = "2"

# 系统通知：按平台使用各自的原生实现
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = "0.5"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
